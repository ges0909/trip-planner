target-version = "py314"
line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "RUF",
    "C4",
    "PIE",
    "T20",
]

ignore = ["E501", "RUF001"]

[lint.per-file-ignores]
"tests/**" = ["T20"]
"tools/**" = ["T20"]

[format]
quote-style = "double"
indent-style = "space"
