[project]
name = "trip-planner-backend"
version = "0.2.0"
description = "AI-powered tour planner backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "pydantic-ai>=0.2.0",
    "logfire[fastapi]>=4.0.0",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.15.0",
]
