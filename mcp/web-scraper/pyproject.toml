[project]
name = "web-scraper-mcp"
version = "1.0.0"
description = "MCP server for fetching web pages that block standard tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "beautifulsoup4",
    "lxml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
